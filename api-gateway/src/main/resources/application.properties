server.port=8080
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Routage Spring Cloud Gateway Server WebMVC
spring.cloud.gateway.server.webmvc.routes[0].id=catalogue-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://service-catalogue
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/products/**

spring.cloud.gateway.server.webmvc.routes[1].id=commande-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://service-commande
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[2].id=stock-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://service-stock
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/stocks/**

# Préfixe classique Gateway
