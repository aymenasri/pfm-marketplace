server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5433/pfm_commandes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pfm
spring.datasource.password=${POSTGRES_PASSWORD}
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.service-catalogue.connectTimeout=1000
spring.cloud.openfeign.client.config.service-catalogue.readTimeout=2000
spring.cloud.openfeign.client.config.service-stock.connectTimeout=1000
spring.cloud.openfeign.client.config.service-stock.readTimeout=2000

resilience4j.circuitbreaker.configs.default.slidingWindowSize=4
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.configs.default.ignoreExceptions=feign.FeignException$NotFound