server.port=8082
spring.datasource.url=jdbc:h2:mem:commandesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=tp
spring.rabbitmq.password=tp123

# ==========================================
# OpenFeign Timeouts
# ==========================================
spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

# ==========================================
# Resilience4j Aspect Order
# ==========================================
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2
resilience4j.bulkhead.bulkhead-aspect-order=3

# ==========================================
# Retry Configuration (Catalogue)
# ==========================================
resilience4j.retry.instances.catalogue-service.max-attempts=3
resilience4j.retry.instances.catalogue-service.wait-duration=500ms
resilience4j.retry.instances.catalogue-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# ==========================================
# Retry Configuration (Stock)
# ==========================================
resilience4j.retry.instances.stock-service.max-attempts=3
resilience4j.retry.instances.stock-service.wait-duration=500ms
resilience4j.retry.instances.stock-service.retry-exceptions=feign.RetryableException,feign.FeignException$ServiceUnavailable

# ==========================================
# Circuit Breaker Configuration (Catalogue)
# ==========================================
resilience4j.circuitbreaker.instances.catalogue-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.catalogue-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.catalogue-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.catalogue-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.catalogue-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalogue-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.catalogue-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalogue-service.automatic-transition-from-open-to-half-open-enabled=true

# ==========================================
# Circuit Breaker Configuration (Stock)
# ==========================================
resilience4j.circuitbreaker.instances.stock-service.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.stock-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.stock-service.sliding-window-size=6
resilience4j.circuitbreaker.instances.stock-service.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.stock-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.stock-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.stock-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.stock-service.automatic-transition-from-open-to-half-open-enabled=true

# ==========================================
# Bulkhead Configuration
# ==========================================
resilience4j.bulkhead.instances.catalogue-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.catalogue-service.max-wait-duration=0ms
resilience4j.bulkhead.instances.stock-service.max-concurrent-calls=10
resilience4j.bulkhead.instances.stock-service.max-wait-duration=0ms

# ==========================================
# Rate Limiter Configuration (Consultation)
# ==========================================
resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms